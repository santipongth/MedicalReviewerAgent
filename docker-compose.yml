name: mra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mra
      POSTGRES_PASSWORD: mra
      POSTGRES_DB: mra
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mra -d mra"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  searxng:
    build:
      context: https://github.com/porespellar/searxng-LDR-academic.git#f314c2258e1a7647f30cae650d951c83f0eb639b
    image: mra/searxng-ldr-academic:f314c22
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-string}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./infra/searxng:/etc/searxng
      - searxngdata:/var/lib/searxng
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    networks: [search]  # not on "data": the metasearch container cannot reach Postgres or Redis

  migrate:
    build: ./backend
    image: mra/backend:dev
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.setup_checkpointer"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    image: mra/backend:dev
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config:ro  # tune models without rebuilding
    networks: [data, search]

  worker:
    image: mra/backend:dev
    env_file: .env
    command: ["arq", "app.worker.settings.WorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config:ro  # tune models without rebuilding
    networks: [data, search]

  web:
    build: ./frontend
    image: mra/web:dev
    environment:
      # Address the browser uses to reach the API (read at request time; no rebuild per deployment).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  searxngdata:

networks:
  data: {}
  search: {}
