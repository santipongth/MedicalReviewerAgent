name: mra

services:
  postgres:
    image: postgres:17-alpine
    # API processes × (DB_POOL_SIZE + DB_MAX_OVERFLOW) + workers × (same + checkpointer pool) must fit
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"]
    environment:
      POSTGRES_USER: mra
      POSTGRES_PASSWORD: mra
      POSTGRES_DB: mra
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mra -d mra"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  searxng:
    build:
      context: https://github.com/porespellar/searxng-LDR-academic.git#f314c2258e1a7647f30cae650d951c83f0eb639b
    image: mra/searxng-ldr-academic:f314c22
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-to-a-long-random-string}
      SEARXNG_BASE_URL: http://searxng:8080/
      # Optional academic API keys (read by our engine modules; empty = keyless, works as before).
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      S2_API_KEY: ${S2_API_KEY:-}
      CORE_API_KEY: ${CORE_API_KEY:-}
    volumes:
      - ./infra/searxng:/etc/searxng
      - searxngdata:/var/lib/searxng
      # Our engine modules (infra/searxng/engines), one read-only file each: mounting the directory
      # would hide the fork's own engines. Add a line here for every new module.
      - ./infra/searxng/engines/mra_pubmed.py:/usr/local/searxng/searx/engines/mra_pubmed.py:ro
      - ./infra/searxng/engines/mra_openalex.py:/usr/local/searxng/searx/engines/mra_openalex.py:ro
      - ./infra/searxng/engines/mra_semantic_scholar.py:/usr/local/searxng/searx/engines/mra_semantic_scholar.py:ro
      - ./infra/searxng/engines/mra_openaire.py:/usr/local/searxng/searx/engines/mra_openaire.py:ro
      - ./infra/searxng/engines/europepmc.py:/usr/local/searxng/searx/engines/europepmc.py:ro
      - ./infra/searxng/engines/doaj.py:/usr/local/searxng/searx/engines/doaj.py:ro
      - ./infra/searxng/engines/plos.py:/usr/local/searxng/searx/engines/plos.py:ro
      - ./infra/searxng/engines/mra_markup.py:/usr/local/searxng/searx/engines/mra_markup.py:ro  # shared helper
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s
    networks: [search]  # not on "data": the metasearch container cannot reach Postgres or Redis

  migrate:
    build: ./backend
    image: mra/backend:dev
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.setup_checkpointer"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  api:
    image: mra/backend:dev
    env_file: .env
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    # Stateless: rate limits, capacity counters, SSE slots and event streams live in Redis, so N processes
    # (or replicas behind a proxy) behave like one.
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers --workers ${API_WORKERS:-2}"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config:ro  # tune models without rebuilding (llm.yaml and LLM_PRESET apply until a version is saved in the admin console)
      - ./backend/evals/cochrane:/app/evals/cochrane:ro  # harness reports and run files (Plan 23c)
    networks: [data, search, edge]

  worker:
    image: mra/backend:dev
    env_file: .env
    environment:
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
    command: ["arq", "app.worker.settings.WorkerSettings"]
    # Each replica runs MAX_CONCURRENT_REVIEWS_PER_WORKER reviews at once; scale with WORKER_REPLICAS.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config:ro  # tune models without rebuilding (llm.yaml and LLM_PRESET apply until a version is saved in the admin console)
    networks: [data, search]

  # Cochrane harness runs started from the admin console (Plan 23c). Off by default: start it with
  # `docker compose --profile harness up -d harness`. It writes run files and reports into backend/evals/cochrane
  # (fixtures and runs hold third-party abstracts and stay out of git and out of the image). Every run spends real
  # money up to the cap the admin types (never above HARNESS_MAX_USD).
  harness:
    image: mra/backend:dev
    profiles: ["harness"]
    env_file: .env
    command: ["arq", "app.worker.harness.HarnessWorkerSettings"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/config:/app/config:ro
      - ./backend/evals/cochrane:/app/evals/cochrane
    networks: [data, search]

  web:
    build: ./frontend
    image: mra/web:dev
    environment:
      # Address the browser uses to reach the API (read at request time; no rebuild per deployment).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      # Server-side calls from the web app (offline HTML report) go straight to the API inside the network.
      INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

  # Single public origin for the web app, REST/SSE and MCP (see infra/caddy/Caddyfile). Production: add the
  # docker-compose.prod.yml overlay, which publishes only this service and turns on TRUST_PROXY and PUBLIC_API_URL=/
  # (TRUST_PROXY is unsafe while api:8000 is published). SITE_ADDRESS=your.domain gives automatic HTTPS.
  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PUBLIC_PORT:-8088}:80"  # the only port other machines can reach; the rest are bound to 127.0.0.1
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    networks: [edge]  # not on "data": the proxy cannot reach Postgres or Redis

volumes:
  pgdata:
  redisdata:
  searxngdata:
  caddydata:

networks:
  data: {}
  search: {}
  edge: {}
