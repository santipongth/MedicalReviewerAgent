- id: CD011612
  pmid: '34510411'
  doi: 10.1002/14651858.cd011612.pub3
  stratum: mental_health
  title: Ketamine and other glutamate receptor modulators for depression in adults
    with unipolar major depressive disorder.
  question: In adults with unipolar major depressive disorder, does ketamine compared
    with placebo increase response rates at 24 hours?
  review_type: meta_analysis
  primary_outcome: response rate at 24 hours (50% reduction on a standardised rating
    scale)
  search_date: '2020-07-31'
  year_to: 2020
  status: eligible
  exclusion_reason: ''
  checked_by_owner: true
  notes: 'checked by Claude Opus 5.5 on the owner''s delegation, 2026-10-12: Response
    at 24 hours, ketamine vs placebo: OR 3.94, 7 studies, 185 participants, very low
    certainty; multi-drug review narrowed to that comparison (esketamine vs placebo:
    5 studies, low certainty).'
