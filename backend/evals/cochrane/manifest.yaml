- id: CD014624
  pmid: '40562419'
  doi: 10.1002/14651858.cd014624.pub2
  stratum: mental_health
  title: Brexanolone, zuranolone and related neurosteroid GABA&lt;sub&gt;A&lt;/sub&gt;
    receptor positive allosteric modulators for postnatal depression.
  question: In women with postnatal depression, do intravenous neurosteroid GABA-A
    receptor positive allosteric modulators (such as brexanolone) compared with placebo
    improve depression response?
  review_type: meta_analysis
  primary_outcome: Depression response
  search_date: '2024-01-31'
  year_to: 2024
  status: eligible
  exclusion_reason: ''
  checked_by_owner: true
  notes: 'checked by Claude Opus 5.5 on the owner''s delegation, 2026-10-12: Depression
    response, IV neurosteroids vs placebo: RR 1.24, 3 studies, 267 women, low certainty
    (oral zuranolone vs placebo has only 2 studies), so the question is narrowed to
    the IV comparison; all 6 RCTs were placebo-controlled.'
