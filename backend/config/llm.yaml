# LLM configuration for the Medical Reviewer Agent.
#
# Pick a preset with `active_preset` (or env LLM_PRESET=...), or tweak any role below.
# Roles: guard (topic filter), planner (search queries), screener (title/abstract screening),
#        extractor (per-paper evidence card), synthesizer (narrative & conclusions).
# Harness roles (help open/smaller models reach big-model quality; see `harness:` below):
#        screener_secondary (2nd vote on borderline papers), extractor_secondary (independent 2nd
#        extraction for cross-checking), normalizer (groups outcome names across papers),
#        conflict_explainer (explains why papers disagree), localizer (English → Thai, numbers checked),
#        escalation (bigger model used only when checks fail or models disagree),
#        refiner (interprets and rewrites the user's question into an answerable research question).
#        normalizer/conflict_explainer/localizer/refiner fall back to planner/extractor/planner/planner if omitted;
#        screener_secondary/extractor_secondary/escalation are disabled if omitted.
#
# Per-role fields (all optional except model):
#   model              provider model id (OpenRouter ids look like "vendor/model")
#   provider           openrouter | anthropic | openai_compatible   (default: default_provider)
#   max_tokens         output token cap
#   temperature, top_p sampling (ignored for Anthropic models that do not accept them)
#   reasoning_effort   none | minimal | low | medium | high | xhigh | max   (only for reasoning models)
#   structured_output  auto | json_schema | tool_calling | json_mode       (auto = from OpenRouter catalog)
#   timeout_seconds    per request
#   fallback_models    OpenRouter fallback chain if the primary model is unavailable
#   extra_body         raw fields merged into the provider request
#
# Browse models with prices:   uv run python -m app.cli.models list --search gemini --structured
# Validate this file:          uv run python -m app.cli.models check
# (inside docker: docker compose run --rm worker python -m app.cli.models check)

active_preset: budget
default_provider: openrouter

# api_key_env must keep its name: OPENROUTER_API_KEY, ANTHROPIC_API_KEY and OPENAI_COMPATIBLE_API_KEY, each only for its
# own provider. The openrouter and anthropic keys are only ever sent to https://openrouter.ai and https://api.anthropic.com,
# so their base_url must stay there; openai_compatible (a local server) may use any http(s) URL.
providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    app_name: Medical Reviewer Agent
    app_url: http://localhost
    require_parameters: true      # only route to providers that support structured outputs/reasoning
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  openai_compatible:              # Ollama / LM Studio / vLLM (local, OpenAI-compatible API)
    base_url: http://host.docker.internal:11434/v1
    api_key_env: OPENAI_COMPATIBLE_API_KEY
    require_parameters: false

presets:
  # Qwen3.5 Flash on every primary role (user decision 2026-10-05, replacing Gemini 2.5 Flash).
  # reasoning_effort none on the Qwen roles: with reasoning on, Qwen3.5 Flash (Alibaba) returns a bare number instead
  # of the requested JSON (measured 2026-10-05); with an explicit none it returns valid JSON.
  # Plan 19 (audit I-10): the second screening vote and the cross-check extraction run on a different model family
  # (Gemini 2.5 Flash Lite, $0.10/$0.40 per 1M, structured outputs; listed in the OpenRouter catalog 2026-10-10), so
  # "two models vote on borderline papers" is true, and escalation goes to Gemini 3.1 Flash Lite, a third model, so
  # it never re-asks a model that already answered (the runner also skips an escalation to the same model).
  budget:
    guard:       {model: qwen/qwen3.5-flash-02-23, max_tokens: 1024,  temperature: 0, reasoning_effort: none, timeout_seconds: 60}
    planner:     {model: qwen/qwen3.5-flash-02-23, max_tokens: 4096,  reasoning_effort: none, timeout_seconds: 90}
    screener:    {model: qwen/qwen3.5-flash-02-23, max_tokens: 4096,  temperature: 0, reasoning_effort: none, timeout_seconds: 90}
    extractor:   {model: qwen/qwen3.5-flash-02-23, max_tokens: 8192,  temperature: 0, reasoning_effort: none, timeout_seconds: 90}
    synthesizer: {model: qwen/qwen3.5-flash-02-23, max_tokens: 16000, reasoning_effort: none, timeout_seconds: 180}
    refiner:             {model: qwen/qwen3.5-flash-02-23, max_tokens: 4096, reasoning_effort: none, timeout_seconds: 90}
    screener_secondary:  {model: google/gemini-2.5-flash-lite, max_tokens: 4096, temperature: 0, timeout_seconds: 90}
    extractor_secondary: {model: google/gemini-2.5-flash-lite, max_tokens: 8192, temperature: 0, timeout_seconds: 90}
    normalizer:          {model: qwen/qwen3.5-flash-02-23, max_tokens: 4096, temperature: 0, reasoning_effort: none, timeout_seconds: 90}
    conflict_explainer:  {model: qwen/qwen3.5-flash-02-23, max_tokens: 2048, reasoning_effort: none, timeout_seconds: 90}
    localizer:           {model: qwen/qwen3.5-flash-02-23, max_tokens: 8192, temperature: 0, reasoning_effort: none, timeout_seconds: 90}
    escalation:          {model: google/gemini-3.1-flash-lite, max_tokens: 8192, temperature: 0, timeout_seconds: 120}

  # Higher quality reading and synthesis with Claude, cheap screening with Gemini.
  balanced:
    guard:       {model: google/gemini-3.1-flash-lite, max_tokens: 1024, temperature: 0}
    planner:     {model: anthropic/claude-sonnet-5.5,  max_tokens: 4096, reasoning_effort: medium}
    screener:    {model: google/gemini-3.1-flash-lite, max_tokens: 4096, temperature: 0}
    extractor:   {model: anthropic/claude-sonnet-5.5,  max_tokens: 8192, reasoning_effort: medium}
    synthesizer: {model: anthropic/claude-opus-5.5,    max_tokens: 20000, reasoning_effort: high, timeout_seconds: 600}
    screener_secondary:  {model: qwen/qwen3.8-flash,          max_tokens: 4096, temperature: 0}
    extractor_secondary: {model: google/gemini-3.5-flash,     max_tokens: 8192, reasoning_effort: low}
    normalizer:          {model: google/gemini-3.1-flash-lite, max_tokens: 4096, temperature: 0}
    conflict_explainer:  {model: anthropic/claude-sonnet-5.5, max_tokens: 2048}
    localizer:           {model: google/gemini-3.1-flash-lite, max_tokens: 8192, temperature: 0}
    escalation:          {model: anthropic/claude-opus-5.5,   max_tokens: 8192, reasoning_effort: medium, timeout_seconds: 600}

  # The original all-Claude design, routed through OpenRouter.
  claude:
    guard:       {model: anthropic/claude-haiku-4.5,  max_tokens: 1024}
    planner:     {model: anthropic/claude-sonnet-5.5, max_tokens: 4096, reasoning_effort: medium}
    screener:    {model: anthropic/claude-haiku-4.5,  max_tokens: 4096}
    extractor:   {model: anthropic/claude-sonnet-5.5, max_tokens: 8192, reasoning_effort: medium}
    synthesizer: {model: anthropic/claude-opus-5.5,   max_tokens: 20000, reasoning_effort: high, timeout_seconds: 600}
    screener_secondary:  {model: google/gemini-3.1-flash-lite, max_tokens: 4096, temperature: 0}  # another family
    extractor_secondary: {model: google/gemini-3.5-flash,     max_tokens: 8192, reasoning_effort: low}
    normalizer:          {model: anthropic/claude-haiku-4.5,  max_tokens: 4096}
    conflict_explainer:  {model: anthropic/claude-sonnet-5.5, max_tokens: 2048}
    localizer:           {model: anthropic/claude-haiku-4.5,  max_tokens: 8192}
    escalation:          {model: anthropic/claude-opus-5.5,   max_tokens: 8192, reasoning_effort: medium, timeout_seconds: 600}

  gemini:
    guard:       {model: google/gemini-3.1-flash-lite,   max_tokens: 1024, temperature: 0}
    planner:     {model: google/gemini-3.5-flash,        max_tokens: 4096, reasoning_effort: low}
    screener:    {model: google/gemini-3.1-flash-lite,   max_tokens: 4096, temperature: 0}
    extractor:   {model: google/gemini-3.5-flash,        max_tokens: 8192, reasoning_effort: medium}
    synthesizer: {model: google/gemini-3.1-pro-preview,  max_tokens: 20000, reasoning_effort: high, timeout_seconds: 600}
    screener_secondary:  {model: qwen/qwen3.8-flash,            max_tokens: 4096, temperature: 0}
    extractor_secondary: {model: qwen/qwen3.8-flash,            max_tokens: 8192, temperature: 0}
    normalizer:          {model: google/gemini-3.1-flash-lite,  max_tokens: 4096, temperature: 0}
    conflict_explainer:  {model: google/gemini-3.5-flash,       max_tokens: 2048, reasoning_effort: low}
    localizer:           {model: google/gemini-3.1-flash-lite,  max_tokens: 8192, temperature: 0}
    escalation:          {model: google/gemini-3.1-pro-preview, max_tokens: 8192, reasoning_effort: medium, timeout_seconds: 600}

  # Direct Anthropic API (needs ANTHROPIC_API_KEY instead of OPENROUTER_API_KEY).
  claude_direct:
    guard:       {model: claude-haiku-4-5,  provider: anthropic, max_tokens: 1024}
    planner:     {model: claude-sonnet-5-5, provider: anthropic, max_tokens: 4096,  reasoning_effort: medium}
    screener:    {model: claude-haiku-4-5,  provider: anthropic, max_tokens: 4096}
    extractor:   {model: claude-sonnet-5-5, provider: anthropic, max_tokens: 8192,  reasoning_effort: medium}
    synthesizer: {model: claude-opus-5-5,   provider: anthropic, max_tokens: 20000, reasoning_effort: high,
                  timeout_seconds: 600}
    screener_secondary:  {model: claude-haiku-4-5,  provider: anthropic, max_tokens: 4096}
    extractor_secondary: {model: claude-sonnet-5-5, provider: anthropic, max_tokens: 8192, reasoning_effort: low}
    normalizer:          {model: claude-haiku-4-5,  provider: anthropic, max_tokens: 4096}
    conflict_explainer:  {model: claude-sonnet-5-5, provider: anthropic, max_tokens: 2048, reasoning_effort: low}
    localizer:           {model: claude-haiku-4-5,  provider: anthropic, max_tokens: 8192}
    escalation:          {model: claude-opus-5-5,   provider: anthropic, max_tokens: 8192, reasoning_effort: medium,
                          timeout_seconds: 600}

# Quality harness for open/smaller models (see docs/superpowers/specs, harness section).
harness:
  max_repairs: 2                  # validate → repair rounds with the exact problems fed back
  refine_critique: true           # interpret the user's question, then one self-critique/revise round
  screen_borderline: [35, 70]     # relevance band that gets a second vote (screener_secondary)
  dual_extraction: true           # extractor_secondary extracts independently; fields are cross-checked
  verify_quotes: true             # every number must sit in a verbatim quote found in the paper text
  quote_match_threshold: 90       # rapidfuzz partial_ratio for "quote found in source"
  escalate_on: [repair_failed, verification_failed, disagreement]
  localize: true                  # reason in English; translate user-facing text last (numbers checked)
  extraction_chars: 30000         # paper text budget per extraction call (title + abstract only; a cap, rarely reached)

# Per-role tweaks applied on top of whichever preset is active, e.g.
#   synthesizer: {model: anthropic/claude-opus-5.5, reasoning_effort: high}
overrides: {}
