[project]
name = "medical-reviewer-agent"
version = "0.1.0"
description = "Medical / scientific literature reviewer agent (LangGraph + FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "slowapi>=0.1.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
  "orjson>=3.10",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.1",
  "httpx>=0.27",
  "langchain-anthropic>=1.7",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "mcp>=2.3",
  "langchain[mcp]>=1.4",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "aiosqlite>=0.20",
  "fakeredis>=2.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs docker compose services (set MRA_INTEGRATION=1)",
  "live: calls the real LLM provider (needs OPENROUTER_API_KEY or ANTHROPIC_API_KEY)",
]
filterwarnings = [
  "ignore:`langchain.mcp` is in beta:langchain_core._api.beta_decorator.LangChainBetaWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() defaults are the framework idiom.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP", "I001"]
